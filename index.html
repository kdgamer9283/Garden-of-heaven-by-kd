<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="kd">
  <meta name="description" content="Cinematic Garden Of Heaven - click anywhere to plant a flower. Built by kd.">
  <meta name="theme-color" content="#0b0620">
  <title>Cinematic Garden Of Heaven · BY KD❤️</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500;1,600&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="kd-watermark">KD<span>♥</span></div>
  <canvas id="garden" aria-label="A night garden where flowers bloom wherever you click"></canvas>

  <header class="top">
    <h1>Cinematic Garden Of Heaven</h1>
    <p id="dedication" class="dedication">Planted for you</p>
    <input id="nameInput" type="text" maxlength="24" placeholder="Dedicate this garden to…" aria-label="Dedicate this garden to someone" autocomplete="off">
  </header>

  <p id="hint" class="hint">✿ Click anywhere to plant a flower ✿</p>

  <nav class="controls" aria-label="Garden controls">
    <button id="btnBouquet" title="Plant a bouquet (Space)" aria-label="Plant a bouquet">💐</button>
    <button id="btnTheme" title="Switch night / dawn (T)" aria-label="Switch between night and dawn">🌙</button>
    <button id="btnMusic" title="Play Fairytale (M)" aria-label="Play or stop the music" aria-pressed="false">🎵</button>
    <button id="btnShot" title="Save a picture (P)" aria-label="Save a picture">📷</button>
    <button id="btnClear" title="Clear the garden (C)" aria-label="Clear the garden">🧹</button>
  </nav>

  <audio id="localTrack" src="music/blue.mp3" loop preload="none"></audio>
  <aside id="musicCard" class="music-card" aria-label="Fairytale (Piano Version) player">
    <div id="spotifyEmbed"></div>
  </aside>

  <div class="volume-control">
  <span>🔊</span>
  <input
    id="volumeSlider"
    type="range"
    min="0"
    max="1"
    step="0.01"
    value="0.5"
    aria-label="Music volume"
  >
</div>

  <p id="counter" class="counter" aria-live="polite"></p>

  <b><footer class="credit">Crafted with <span class="beat">💞♥💞</span> BY <strong>KD</strong></footer></b>

  <script src="script.js"></script>
  <script src="https://open.spotify.com/embed/iframe-api/v1" async></script>
</body>
</html>
